<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상대 단위 실습 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. vw와 vh를 활용한 상단 배너 -->
    <header class="hero-banner">
        <h1>반응형 웹 배너 (vw & vh)</h1>
    </header>

    <!-- 2. %와 max-width, rem을 활용한 메인 콘텐츠 박스 -->
    <main class="container">
        <h2>상대 단위 이해하기</h2>
        <p>이 본문 상자는 브라우저 창 너비가 아무리 넓어져도 최대 800px까지만 커지고, 화면이 좁아지면 양옆에 5%씩 여백을 남긴 채(너비 90%) 유연하게 줄어듭니다.</p>
        <p>글자 크기와 내부 여백은 <code>rem</code> 단위를 사용하여 브라우저 설정에 맞춰 안전하게 스케일링됩니다.</p>
    </main>

</body>
</html>
