<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사칙연산 프로그램</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <h1>사칙연산 프로그램</h1>

        <div class="input-group">
            <label for="num1">첫 번째 숫자</label>
            <input type="text" id="num1" placeholder="숫자를 입력하세요">
        </div>

        <div class="input-group">
            <label for="operator">연산자</label>
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
        </div>

        <div class="input-group">
            <label for="num2">두 번째 숫자</label>
            <input type="text" id="num2" placeholder="숫자를 입력하세요">
        </div>

        <button id="calculate">계산</button>
    </main>

    <script src="app.js"></script>
</body>
</html>
